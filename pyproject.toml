[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linqex"
version = "2.0"
description = "A High-Performance, Production-Ready Python Implementation of C# LINQ with Deferred Execution."
readme = {file = "README-pypi.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
  {name = "TahsinCr", email = "TahsinCrs@gmail.com"}
]

keywords = [
    "linq", 
    "csharp",
    "enumerable", 
    "query", 
    "collections",
    "lazy-evaluation",
    "data-manipulation",
    "functional-programming",
    "pipeline",
    "iterator"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

dependencies = []

[project.urls]
Homepage = "https://github.com/TahsinCr/python-linqex"
Repository = "https://github.com/TahsinCr/python-linqex"
"Bug Tracker" = "https://github.com/TahsinCr/python-linqex/issues"
"Changelog" = "https://github.com/TahsinCr/python-linqex/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["linqex"]
